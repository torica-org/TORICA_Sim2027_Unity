name: Discord Notifications

on:
  workflow_dispatch:

  issues:
    types: [opened, closed, reopened]

  issue_comment:
    types: [created]

  pull_request:
    types: [opened, reopened, ready_for_review, closed]

  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────
      # Manual preview
      # ─────────────────────────────
      - name: Preview
        if: github.event_name == 'workflow_dispatch'
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Discord Notifications · Preview'
          embed-descriptions: 'GitHub notifications are now connected to this channel.'
          embed-urls: 'https://github.com/${{ github.repository }}'
          embed-colors: '58A6FF'

          embed-authors: '${{ github.actor }}'
          embed-author-urls: 'https://github.com/${{ github.actor }}'
          embed-author-icons: 'https://github.com/${{ github.actor }}.png'

          embed-fields: |
            [
              {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
              {"name": "Event", "value": "Manual preview", "inline": true}
            ]

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'


      # ─────────────────────────────
      # Issues
      # ─────────────────────────────
      - name: Issue
        if: github.event_name == 'issues'
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Issue #${{ github.event.issue.number }} · ${{ github.event.action }}'
          embed-descriptions: '${{ github.event.issue.title }}'
          embed-urls: '${{ github.event.issue.html_url }}'

          embed-colors: "${{
            github.event.action == 'opened' && '3FB950' ||
            github.event.action == 'closed' && 'F85149' ||
            'D29922'
            }}"

          embed-authors: '${{ github.event.issue.user.login }}'
          embed-author-urls: '${{ github.event.issue.user.html_url }}'
          embed-author-icons: '${{ github.event.issue.user.avatar_url }}'

          embed-fields: |
            [
              {"name": "Author", "value": "${{ github.event.issue.user.login }}", "inline": true},
              {"name": "Comments", "value": "${{ github.event.issue.comments }}", "inline": true}
            ]

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'


      # ─────────────────────────────
      # Issue / PR comments
      # ─────────────────────────────
      - name: Comment
        if: github.event_name == 'issue_comment'
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Comment on #${{ github.event.issue.number }}'
          embed-descriptions: '${{ github.event.issue.title }}'
          embed-urls: '${{ github.event.comment.html_url }}'
          embed-colors: '58A6FF'

          embed-authors: '${{ github.event.comment.user.login }}'
          embed-author-urls: '${{ github.event.comment.user.html_url }}'
          embed-author-icons: '${{ github.event.comment.user.avatar_url }}'

          embed-fields: |
            [
              {"name": "Author", "value": "${{ github.event.comment.user.login }}", "inline": true},
              {"name": "Comments", "value": "${{ github.event.issue.comments }}", "inline": true}
            ]

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'


      # ─────────────────────────────
      # Pull Requests — open / reopen / ready
      # ─────────────────────────────
      - name: Pull Request
        if: >
          github.event_name == 'pull_request' &&
          github.event.action != 'closed'
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Pull Request #${{ github.event.pull_request.number }} · ${{ github.event.action }}'
          embed-descriptions: '${{ github.event.pull_request.title }}'
          embed-urls: '${{ github.event.pull_request.html_url }}'
          embed-colors: '3FB950'

          embed-authors: '${{ github.event.pull_request.user.login }}'
          embed-author-urls: '${{ github.event.pull_request.user.html_url }}'
          embed-author-icons: '${{ github.event.pull_request.user.avatar_url }}'

          embed-fields: |
            [
              {"name": "Base", "value": "`${{ github.event.pull_request.base.ref }}`", "inline": true},
              {"name": "Head", "value": "`${{ github.event.pull_request.head.ref }}`", "inline": true},
              {"name": "Changes", "value": "+${{ github.event.pull_request.additions }} / -${{ github.event.pull_request.deletions }}", "inline": true}
            ]

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'


      # ─────────────────────────────
      # Pull Requests — merged
      # ─────────────────────────────
      - name: Pull Request Merged
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Pull Request #${{ github.event.pull_request.number }} · merged'
          embed-descriptions: '${{ github.event.pull_request.title }}'
          embed-urls: '${{ github.event.pull_request.html_url }}'
          embed-colors: 'A371F7'

          embed-authors: '${{ github.event.pull_request.user.login }}'
          embed-author-urls: '${{ github.event.pull_request.user.html_url }}'
          embed-author-icons: '${{ github.event.pull_request.user.avatar_url }}'

          embed-fields: |
            [
              {"name": "Base", "value": "`${{ github.event.pull_request.base.ref }}`", "inline": true},
              {"name": "Head", "value": "`${{ github.event.pull_request.head.ref }}`", "inline": true},
              {"name": "Changes", "value": "+${{ github.event.pull_request.additions }} / -${{ github.event.pull_request.deletions }}", "inline": true}
            ]

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'


      # ─────────────────────────────
      # Pull Requests — closed without merge
      # ─────────────────────────────
      - name: Pull Request Closed
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == false
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Pull Request #${{ github.event.pull_request.number }} · closed'
          embed-descriptions: '${{ github.event.pull_request.title }}'
          embed-urls: '${{ github.event.pull_request.html_url }}'
          embed-colors: 'F85149'

          embed-authors: '${{ github.event.pull_request.user.login }}'
          embed-author-urls: '${{ github.event.pull_request.user.html_url }}'
          embed-author-icons: '${{ github.event.pull_request.user.avatar_url }}'

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'


      # ─────────────────────────────
      # Releases
      # ─────────────────────────────
      - name: Release
        if: github.event_name == 'release'
        uses: chase-roohms/discord-notify@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          embed-titles: 'Release ${{ github.event.release.tag_name }}'
          embed-descriptions: '${{ github.event.release.name }}'
          embed-urls: '${{ github.event.release.html_url }}'
          embed-colors: '58A6FF'

          embed-authors: '${{ github.event.release.author.login }}'
          embed-author-urls: '${{ github.event.release.author.html_url }}'
          embed-author-icons: '${{ github.event.release.author.avatar_url }}'

          embed-fields: |
            [
              {"name": "Tag", "value": "`${{ github.event.release.tag_name }}`", "inline": true},
              {"name": "Prerelease", "value": "${{ github.event.release.prerelease }}", "inline": true}
            ]

          embed-footers: '${{ github.repository }}'
          embed-timestamps: 'now'